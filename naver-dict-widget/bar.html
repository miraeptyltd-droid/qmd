<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>영어사전</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  body { font: 12px "Segoe UI", "Malgun Gothic", sans-serif; user-select: none; }
  .bar {
    height: 28px; display: flex; align-items: center; gap: 2px; padding: 0 4px;
    background: #f5f6f8; border-bottom: 1px solid #e3e5e8;
    -webkit-app-region: drag; /* 이 바를 잡고 창을 옮김 */
  }
  .title { flex: 1; padding-left: 6px; color: #6b7280; }
  button {
    -webkit-app-region: no-drag;
    width: 26px; height: 22px; border: 0; border-radius: 5px; background: transparent;
    color: #4b5563; font-size: 13px; line-height: 22px; padding: 0; cursor: pointer;
  }
  button:hover { background: #e5e7eb; }
  button:disabled { opacity: .35; cursor: default; background: transparent; }
  #pin.on { color: #2f6fe4; }
  #hide:hover { background: #e81123; color: #fff; }
</style>
</head>
<body>
  <div class="bar">
    <button id="back" title="뒤로 (Alt+←)" disabled>&#x2190;</button>
    <button id="home" title="처음 화면 (Alt+Home)">&#x2302;</button>
    <span class="title">영어사전</span>
    <button id="pin" title="항상 위에 표시">&#x1F4CC;&#xFE0E;</button>
    <button id="hide" title="숨기기 (Esc)">&#x2715;</button>
  </div>
<script>
  for (const id of ['back', 'home', 'pin', 'hide']) {
    document.getElementById(id).addEventListener('click', () => window.bar.send(id));
  }
  window.bar.onState(({ pinned, canGoBack }) => {
    document.getElementById('pin').classList.toggle('on', pinned);
    document.getElementById('pin').title = pinned ? '항상 위에 표시: 켜짐' : '항상 위에 표시: 꺼짐';
    document.getElementById('back').disabled = !canGoBack;
  });
</script>
</body>
</html>
